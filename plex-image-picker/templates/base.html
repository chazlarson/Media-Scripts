<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plex Art Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .pagination { flex-wrap: wrap; }
    </style>
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('libraries') }}">Plex Image Picker</a>
        <button id="theme-toggle" type="button" class="btn btn-outline-secondary btn-sm ms-auto">🌙</button>
      </div>
    </nav>
    <div class="container">
      {% with msgs = get_flashed_messages() %}
        {% if msgs %}
          <div class="alert alert-info">
            {% for m in msgs %} <p>{{ m }}</p> {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
