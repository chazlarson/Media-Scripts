name: CI

on:
  push:
  pull_request:

jobs:
  uv:
    name: uv sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the script lockfile
        run: uv sync --frozen

      - name: Install the image picker lockfile
        working-directory: plex-image-picker
        run: uv sync --frozen
